[trust]
score_success = 1.0
score_suboptimal = 0.7
score_mode_switch_agent = 0.8
score_mode_switch_controller = 0.3
score_failure = 0.2
score_path_denial = 0.1
score_repeated_failure = 0.0

alpha_short = 0.4
alpha_session = 0.08
alpha_baseline = 0.02

tighten_threshold = 0.3
auto_tighten_threshold = 0.5
loosen_threshold = 0.9
loosen_sustained_turns = 20

# Security-sensitive gate policy. NOTE: the [trust] section is only ever
# read from these shipped defaults or from policy.toml in the out-of-tree
# state directory — never from the project's .riggs/config.toml, which the
# scored subject can edit.
initial_trust = 0.4
gate_threshold = 0.5
violation_holdoff_turns = 20

[ratchet]
min_frequency = 5
min_sessions = 3
min_success_rate = 0.8
lookback_days = 30
# Heed gate for nudged tool promotions (kibitzer A/B evidence).
# Frequency alone never qualifies a candidate.
min_nudge_trials = 5
min_heed_rate = 0.25
min_heed_lift = 0.0

[sandbox]
memory_headroom = 2.0
timeout_headroom = 3.0
cpu_headroom = 2.0
min_runs_for_tightening = 5

[metrics]
default_period_days = 30

[briefing]
lookback_days = 14
top_tools = 5

[store]
path = ".riggs/store.duckdb"
